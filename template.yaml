AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Telegram devotion bots — one function, one schedule per channel.

Parameters:
  BotToken:
    Type: String
    NoEcho: true
    Description: Telegram bot token (the bot must be an admin of every channel).
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional. Email to notify when a send fails.

Conditions:
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Resources:
  DevotionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handler.lambda_handler
      Runtime: python3.12
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 30
      Environment:
        Variables:
          BOT_TOKEN: !Ref BotToken
      # No async retries: a retry after Telegram already accepted the message
      # would post the devotion twice. A failure alarms; re-send with `make invoke`.
      EventInvokeConfig:
        MaximumRetryAttempts: 0
      Events:
        # One schedule per channel. The Input names the channel; the function
        # works out the date itself, so the cron only sets delivery time.
        Psalms:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-psalms"
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Singapore
            Input: '{"channel": "psalms"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 1800
        OurDailyWalk:
          Type: ScheduleV2
          Properties:
            Name: !Sub "${AWS::StackName}-our-daily-walk"
            ScheduleExpression: cron(0 6 * * ? *)
            ScheduleExpressionTimezone: Asia/Singapore
            Input: '{"channel": "our_daily_walk"}'
            RetryPolicy:
              MaximumRetryAttempts: 2
              MaximumEventAgeInSeconds: 1800

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${DevotionFunction}"
      RetentionInDays: 90

  ErrorsTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlarmEmail

  ErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasAlarmEmail
    Properties:
      AlarmDescription: A devotion send failed. Check the function's logs.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref DevotionFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ErrorsTopic]

Outputs:
  FunctionName:
    Value: !Ref DevotionFunction
